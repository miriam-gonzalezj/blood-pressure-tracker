plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mtagj.bptracker'
    compileSdk 35

    defaultConfig {
        applicationId "com.mtagj.bptracker"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.core:core:1.13.1'

    // Local storage
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Reads the monitor's 7-segment LCD display. NOT text OCR (ML Kit and every
    // general-purpose text recognizer are trained on font glyphs and cannot read
    // a segmented display at all -- confirmed against this exact model of
    // failure, see README). This decodes each digit's lit/unlit segments
    // directly instead, entirely on-device, offline.
    implementation 'org.opencv:opencv:4.12.0'

    // CameraX: live viewfinder + real-time frame analysis, so the monitor's
    // reading is scanned straight off the live feed — no photo file is ever
    // written to disk.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // Best-effort altitude from GPS (optional feature — see AltitudeHelper)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Lee la orientación EXIF de fotos elegidas de la galería. MediaStore.Images.Media
    // .getBitmap() (usado en OcrHelper para "usar una foto existente") NO corrige la
    // rotación por sí solo -- una foto tomada en vertical puede llegar como bitmap en
    // horizontal si el teléfono la guardó solo con la bandera EXIF en vez de rotar los
    // píxeles. Sin corregir esto, el lector de 7 segmentos ve los dígitos de lado.
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
